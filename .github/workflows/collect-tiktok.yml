name: Collecte TikTok

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-tiktok:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run TikTok collector
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: python scripts/collect.py --mode tiktok

      - name: Commit TikTok data
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp public/data/tiktok.json /tmp/tiktok_result.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/tiktok_result.json public/data/tiktok.json
          git add public/data/tiktok.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update TikTok ads data ($(date -u +%Y-%m-%d))"
            git push
          fi
